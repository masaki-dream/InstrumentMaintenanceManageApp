name: CI Backend

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches: [ "main" ]
    paths:
      - "backend/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test